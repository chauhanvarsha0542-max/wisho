<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Templates - Wisho</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#7C3AED,#EC4899);
color:white;
padding:20px;
}

h1{
text-align:center;
margin:20px 0 30px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
border-radius:20px;
padding:15px;
text-align:center;
transition:.3s;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.card:hover{
transform:translateY(-8px);
}

.preview{
height:160px;
border-radius:15px;
margin-bottom:12px;
background:linear-gradient(135deg,#ffffff,#ffd6ec);
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
}

.name{
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>Choose Template</h1>

<div class="grid">

<div class="card">
<div class="preview">🎂</div>
<div class="name">Classic</div>
</div>

<div class="card">
<div class="preview">💖</div>
<div class="name">Romantic</div>
</div>

<div class="card">
<div class="preview">✨</div>
<div class="name">Elegant</div>
</div>

<div class="card">
<div class="preview">🌸</div>
<div class="name">Floral</div>
</div>

<div class="card">
<div class="preview">👑</div>
<div class="name">Luxury</div>
</div>

<a href="editor.html" style="text-decoration:none;color:white;">
<div class="card">
  <div class="preview">🎉</div>
<div class="name">Party</div>
</div>
</a>

</div>

</body>
</html>
