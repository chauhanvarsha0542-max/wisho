<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Editor - Wisho</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#7b2ff7,#f107a3);
color:white;
}

.container{
max-width:500px;
margin:auto;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:30px;
background:white;
color:#7b2ff7;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Create Your Card</h1>

<input type="text" placeholder="Receiver Name">

<textarea rows="5" placeholder="Write your message..."></textarea>

<input type="file">

<button>Generate Card</button>

</div>

</body>
</html>
