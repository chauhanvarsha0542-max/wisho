<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Occasion - Wisho</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#7C3AED,#EC4899);
padding:20px;
color:white;
}

h1{
text-align:center;
margin:25px 0;
font-size:32px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
border-radius:20px;
padding:25px;
text-align:center;
font-size:20px;
cursor:pointer;
transition:.3s;
}

.card:active{
transform:scale(.95);
}

.emoji{
font-size:42px;
display:block;
margin-bottom:10px;
}
</style>

</head>

<body>

<h1>Choose an Occasion 💜</h1>

<div class="grid">

<div class="card">
<span class="emoji">🎂</span>
Birthday
</div>

<div class="card">
<span class="emoji">❤️</span>
Anniversary
</div>

<div class="card">
<span class="emoji">💍</span>
Proposal
</div>

<div class="card">
<span class="emoji">🥺</span>
Sorry
</div>

<div class="card">
<span class="emoji">🤝</span>
Friendship
</div>

<div class="card">
<span class="emoji">🎓</span>
Graduation
</div>

<div class="card">
<span class="emoji">👶</span>
Baby Shower
</div>

<div class="card">
<span class="emoji">💼</span>
Congratulations
</div>

<div class="card">
<span class="emoji">🎄</span>
Christmas
</div>

<div class="card">
<span class="emoji">🪔</span>
Diwali
</div>

<div class="card">
<span class="emoji">🌙</span>
Eid
</div>

<div class="card">
<span class="emoji">❤️‍🩹</span>
Miss You
</div>

</div>

</body>
</html>
