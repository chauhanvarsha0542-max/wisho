<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview - Wisho</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#7C3AED,#EC4899);
padding:20px;
}

.card{
width:100%;
max-width:360px;
background:white;
border-radius:25px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
animation:fadeIn 1s ease;
}

h1{
color:#7C3AED;
margin-bottom:15px;
}

.photo{
width:120px;
height:120px;
margin:15px auto;
border-radius:50%;
background:#eee;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.message{
margin:20px 0;
font-size:18px;
color:#555;
line-height:1.6;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:50px;
background:#7C3AED;
color:white;
font-size:18px;
cursor:pointer;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>

<body>

<div class="card">

<h1>💜 Happy Birthday</h1>

<div class="photo">
📷
</div>

<div class="message">
Your beautiful message will appear here...
</div>

<button>Share Card 🔗</button>

</div>

</body>
</html>
